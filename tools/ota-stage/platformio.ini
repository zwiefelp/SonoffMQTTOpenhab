; Zwischen-Image fuer OTA in zwei Stufen (siehe README.md): nur WLAN + ArduinoOTA,
; ohne mDNS, damit es gzip-komprimiert auch in wenig freien Platz passt.
; WLAN-Zugangsdaten kommen aus ../../src/config.h (wie bei der Firmware).
[env:sonoff_s20]
platform = espressif8266
framework = arduino
board = sonoff_s20
board_build.f_cpu = 80000000L
build_flags =
	-I $PROJECT_DIR/../../src
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	-D NO_GLOBAL_MDNS
